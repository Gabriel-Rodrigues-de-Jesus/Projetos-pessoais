<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="hmaranha.png" type="image/x-icon">
    <title>Tags</title>
</head>
<body>
    <h1>Tags em HTML5</h1>
    <p>Em HTML5 podemos inserir várias tags conforme a lsita seguir. Passe o mouse por cima e verá qual Tag utilizar em cada caso</p>
    <ul>
        <li><abbr title="Usar a tag &lt;p&gt;"><b>Parágrafos</b>
        </abbr></li>
        <li><abbr title="Usar a tag &lt;h1...h6&gt;"><b>Títulos</b></abbr></li>
        <li><abbr title="Usar tag &lt;img&gt;"><b>Imagens</b></abbr></li>
        <li><abbr title="Usar tag &lt;abbr&gt;"><b>Abreviações</b></abbr></li>
        <li><abbr title="Usar tag &lt;code&gt;"><b>Códigos-fonte</b></abbr></li>
        <li><abbr title="Usar tags &lt;ol&gt; e &lt;li&gt;"><b>Listas separadas</b></abbr></li>
        <li><abbr title="Usar tags &lt;ul&gt; e &lt;li&gt;"><b>Listas com demarcadores</b></abbr></li>
    </ul>
</body>
</html>
